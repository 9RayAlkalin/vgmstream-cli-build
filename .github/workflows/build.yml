name: Build and Release vgmstream-cli

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install injector dependencies
        run: uv sync --locked

      - name: Clone vgmstream
        run: git clone https://github.com/vgmstream/vgmstream.git

      - name: Fetch Git tags
        working-directory: ./vgmstream
        run: git fetch --prune --tags

      - name: Apply CLI overlay and export audit patch
        shell: pwsh
        run: uv run vgmstream-cli-build sync --repo-root ./vgmstream --workspace-root .

      - name: Upload audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cli-overlay-audit
          path: audit/cli-overlay.audit.patch

      - name: Get version
        id: version
        working-directory: ./vgmstream
        shell: pwsh
        run: |
          $version = git describe --tags --always
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Initialize build environment
        working-directory: ./vgmstream
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -NoProfile -File .\msvc-build.ps1 Init

      - name: Build
        working-directory: ./vgmstream
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -NoProfile -File .\msvc-build.ps1 Build

      - name: Package Artifacts
        working-directory: ./vgmstream
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -NoProfile -File .\msvc-build.ps1 PackageArtifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vgmstream-cli-windows
          path: vgmstream/bin/artifacts/cli-x64

  build-linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install injector dependencies
        run: uv sync --locked

      - name: Clone vgmstream
        run: git clone https://github.com/vgmstream/vgmstream.git

      - name: Fetch Git tags
        working-directory: ./vgmstream
        run: git fetch --prune --tags

      - name: Apply CLI overlay and export audit patch
        shell: pwsh
        run: uv run vgmstream-cli-build sync --repo-root ./vgmstream --workspace-root .

      - name: Get version
        id: version
        working-directory: ./vgmstream
        run: |
          version=$(git describe --tags --always)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm libopus-dev

      - name: Create build environment
        working-directory: ./vgmstream
        run: |
          cmake -E make_directory build
          echo "RELEASE=$(lsb_release -sr)" >> $GITHUB_ENV

      - name: Cache celt
        uses: actions/cache@v4
        with:
          path: |
            vgmstream/dependencies/celt-0061
            vgmstream/dependencies/celt-0110
            vgmstream/build/dependencies/celt-0061/libcelt/.libs
            vgmstream/build/dependencies/celt-0110/libcelt/.libs
          key: linux-${{ env.RELEASE }}-celt-${{ hashFiles('vgmstream/cmake/dependencies/celt.cmake') }}

      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            vgmstream/build/dependencies/ffmpeg/bin/usr/local/include
            vgmstream/build/dependencies/ffmpeg/bin/usr/local/lib
          key: linux-${{ env.RELEASE }}-ffmpeg-${{ hashFiles('vgmstream/cmake/dependencies/ffmpeg.cmake') }}

      - name: Cache atrac9
        uses: actions/cache@v4
        with:
          path: |
            vgmstream/build/dependencies/LibAtrac9/bin
          key: linux-${{ env.RELEASE }}-atrac9-${{ hashFiles('vgmstream/cmake/dependencies/atrac9.cmake') }}

      - name: Cache g719
        uses: actions/cache@v4
        with:
          path: |
            vgmstream/build/dependencies/libg719_decode/libg719_decode.a
          key: linux-${{ env.RELEASE }}-g719-${{ hashFiles('vgmstream/cmake/dependencies/g719.cmake') }}

      - name: Cache mpg123
        uses: actions/cache@v4
        with:
          path: |
            vgmstream/dependencies/mpg123
            vgmstream/build/dependencies/mpg123/src/libmpg123/.libs
          key: linux-${{ env.RELEASE }}-mpg123-${{ hashFiles('vgmstream/cmake/dependencies/mpg123.cmake') }}

      - name: Cache speex
        uses: actions/cache@v4
        with:
          path: |
            vgmstream/build/dependencies/speex/libspeex/.libs
          key: linux-${{ env.RELEASE }}-speex-${{ hashFiles('vgmstream/cmake/dependencies/speex.cmake') }}

      - name: Cache ogg
        uses: actions/cache@v4
        with:
          path: |
            vgmstream/build/dependencies/ogg/libogg.a
            vgmstream/build/dependencies/ogg/include
          key: linux-${{ env.RELEASE }}-ogg-${{ hashFiles('vgmstream/cmake/dependencies/ogg.cmake') }}

      - name: Cache vorbis
        uses: actions/cache@v4
        with:
          path: |
            vgmstream/build/dependencies/vorbis/lib/*.a
          key: linux-${{ env.RELEASE }}-vorbis-${{ hashFiles('vgmstream/cmake/dependencies/vorbis.cmake') }}

      - name: Configure CMake
        shell: bash
        working-directory: vgmstream/build
        run: cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=ON

      - name: Build
        working-directory: vgmstream/build
        shell: bash
        run: cmake --build . --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vgmstream-cli-linux
          path: vgmstream/build/cli/vgmstream-cli

  # ========== 新增 macOS Universal 构建 ==========
  build-macos-universal:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install injector dependencies
        run: uv sync --locked

      - name: Clone vgmstream
        run: git clone https://github.com/vgmstream/vgmstream.git

      - name: Fetch Git tags
        working-directory: ./vgmstream
        run: git fetch --prune --tags

      - name: Apply CLI overlay and export audit patch
        shell: bash
        run: uv run vgmstream-cli-build sync --repo-root ./vgmstream --workspace-root .

      - name: Get version
        id: version
        working-directory: ./vgmstream
        run: |
          version=$(git describe --tags --always)
          echo "version=$version" >> $GITHUB_OUTPUT

      # ---- ARM64 构建 ----
      - name: Install dependencies (ARM64)
        run: |
          eval "$(brew shellenv)"
          brew install autoconf automake ffmpeg libao libvorbis mpg123 libtool
          ls -l $(brew --prefix)/lib/libmpg123*

      - name: Build ARM64
        run: |
          eval "$(brew shellenv)"
          cmake -S ./vgmstream -B ./build-arm64 \
                -DBUILD_AUDACIOUS:BOOL=OFF \
                -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
                -DCMAKE_OSX_ARCHITECTURES=arm64
          find ./build-arm64 -name link.txt -exec sed -i '' 's|-lmpg123|/opt/homebrew/lib/libmpg123.dylib|g' {} \;
          cmake --build ./build-arm64

      # ---- x86_64 构建 ----
      - name: Install dependencies (x86_64)
        run: |
          arch -x86_64 /usr/local/bin/brew install autoconf automake ffmpeg libao libvorbis mpg123 libtool
          ls -l /usr/local/lib/libmpg123*
  
      - name: Build x86_64
        run: |
          export LDFLAGS="-L/usr/local/lib"
          export CPPFLAGS="-I/usr/local/include"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig"
          export LIBRARY_PATH="/usr/local/lib"

          cmake -S ./vgmstream -B ./build-x86_64 \
                -DBUILD_AUDACIOUS:BOOL=OFF \
                -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
                -DCMAKE_OSX_ARCHITECTURES=x86_64 \
                -DCMAKE_PREFIX_PATH=/usr/local \
                -DCMAKE_SYSTEM_LIBRARY_PATH=/usr/local/lib \
                -DMPG123_LIBRARY=/usr/local/lib/libmpg123.dylib \
                -DMPG123_INCLUDE_DIR=/usr/local/include

          find ./build-x86_64 -name link.txt -exec sed -i '' 's|-lmpg123|/usr/local/lib/libmpg123.dylib|g' {} \;
          cmake --build ./build-x86_64

      # ---- 合并 Universal ----
      - name: Create Universal binary
        run: |
          mkdir -p universal
          lipo -create ./build-arm64/cli/vgmstream-cli ./build-x86_64/cli/vgmstream-cli \
               -output ./universal/vgmstream-cli
          file ./universal/vgmstream-cli

      - name: Upload artifact (macOS universal)
        uses: actions/upload-artifact@v4
        with:
          name: vgmstream-cli-macos-universal
          path: universal/vgmstream-cli

  # ========== Release 阶段 ==========
  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos-universal]   # 新增 macOS 依赖
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          (cd artifacts/vgmstream-cli-windows && zip -r ../../vgmstream-win64.zip .)
          (cd artifacts/vgmstream-cli-linux   && zip -r ../../vgmstream-linux-cli.zip .)
          (cp artifacts/vgmstream-cli-macos-universal/vgmstream-cli . && zip vgmstream-macos-universal.zip vgmstream-cli)
          
          ls -l

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-windows.outputs.version }}
          name: "vgmstream-cli ${{ needs.build-windows.outputs.version }}"
          body: |
            Automated build of overlay-injected vgmstream-cli.

            **Modifications:**
            - Adds wildcards for output path: `?p` (source path) and `?b` (source basename).
            - Supports directory as input for recursive scanning of `.wem` files.
            - Adds `-Y` option to delete source file after transcoding (DANGEROUS).
          files: |
            vgmstream-win64.zip
            vgmstream-linux-cli.zip
            vgmstream-macos-universal.zip
            artifacts/cli-overlay-audit/cli-overlay.audit.patch
